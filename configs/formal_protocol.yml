seeds: [2024, 2025, 2026]
pretrain_epochs: 300
joint_train_epochs: 300
batch_size: 32
learning_rates:
  pretrain: 0.001
  predictor_finetune: 0.000001
  super_resolution: 0.0001
  discriminator: 0.000005
loss_weights:
  super_resolution: 0.1
  prediction:
    TaxiBJ_P1: 0.01
    TaxiBJ_P2: 0.9
    TaxiBJ_P3: 0.01
    TaxiBJ_P4: 0.01
    BikeNYC: 0.9
  adversarial:
    default_supervised: 0.0
    gan_variant: 0.01
discriminator_schedule:
  update_interval: 20
  real_label_target: 0.9
missing_rates: [0.1, 0.3, 0.5, 0.7]
primary_metrics: [RMSE, MAE]
auxiliary_metrics: [MAPE]
